name: Claude a petición

# Se activa escribiendo @claude en un comentario de issue o PR.
#   - "@claude revisa" en un PR → repite la revisión de código con las instrucciones de .github/claude/revision.md.
#   - Cualquier otro "@claude …" → Claude atiende el pedido del comentario.
# En un PR, Claude solo trabaja si el CI del último commit está en verde.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Solo personas con acceso de escritura al repositorio pueden invocarlo.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: ¿El CI está en verde?
        id: ci
        if: env.PR != ''
        run: |
          ESTADOS=$(gh pr view "$PR" --repo ${{ github.repository }} --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select(.workflowName == "CI" and (.name | startswith("4 ·") | not))
                   | (.conclusion // .status)] | unique | join(",")')
          echo "Estados del CI: $ESTADOS"
          if [ -z "$ESTADOS" ] || echo "$ESTADOS" | grep -qvE '^(SUCCESS|SKIPPED|NEUTRAL)(,(SUCCESS|SKIPPED|NEUTRAL))*$'; then
            gh pr comment "$PR" --repo ${{ github.repository }} --body \
              "El CI de este PR no está en verde (${ESTADOS:-sin ejecutar}). Claude se invoca cuando todas las etapas pasen."
            echo "verde=false" >> "$GITHUB_OUTPUT"
          else
            echo "verde=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ¿Pide una revisión?
        id: modo
        run: |
          if [ -n "$PR" ] && echo "$CUERPO" | grep -qiE '@claude[[:space:]]+revis'; then
            echo "revision=true" >> "$GITHUB_OUTPUT"
          else
            echo "revision=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CUERPO: ${{ github.event.comment.body }}

      - uses: actions/checkout@v6
        if: env.PR == '' || steps.ci.outputs.verde == 'true'
        with:
          fetch-depth: 1

      - name: Instrucciones de revisión (desde main)
        id: instrucciones
        if: steps.modo.outputs.revision == 'true' && steps.ci.outputs.verde == 'true'
        run: |
          git fetch --depth=1 origin main
          {
            echo 'texto<<FIN_INSTRUCCIONES'
            git show FETCH_HEAD:.github/claude/revision.md
            echo 'FIN_INSTRUCCIONES'
          } >> "$GITHUB_OUTPUT"

      - name: Revisión de código
        if: steps.modo.outputs.revision == 'true' && steps.ci.outputs.verde == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPOSITORIO: ${{ github.repository }}
            PULL REQUEST: #${{ env.PR }}

            ${{ steps.instrucciones.outputs.texto }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
            --max-turns 40

      - name: Pedido libre
        if: steps.modo.outputs.revision != 'true' && (env.PR == '' || steps.ci.outputs.verde == 'true')
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: --max-turns 30
