name: Revisión con Claude

# Solo al abrir el PR o marcarlo listo, NO en cada push.
# Revisar en cada push multiplica el costo sin mejorar el resultado.
on:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - 'app/**'
      - 'database/migrations/**'
      - 'routes/**'
      - 'tests/**'

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Para presupuesto separado del de tu suscripción, usa ANTHROPIC_API_KEY
          # con tope de gasto en la Consola. Para usar tu suscripción,
          # cambia por claude_code_oauth_token y genera el token con:
          #   claude setup-token
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --max-turns 15
