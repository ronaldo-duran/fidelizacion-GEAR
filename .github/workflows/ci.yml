name: CI

# Etapas:
#   1. Calidad    → PHP (Pint, PHPCS, PHPMD, PHPStan, auditoría), frontend (ESLint, Prettier,
#                   auditoría, build), versión, mensajes de commit y tamaño del PR.
#   2. Pruebas    → Pest sobre PostgreSQL y MySQL (solo si la etapa 1 pasa).
#   3. E2E        → Playwright contra la app real (solo si las pruebas pasan).
#
# La revisión de Claude no corre aquí: se pide con /revisar en un PR (ver claude-ondemand.yml).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Con "shell: bash" explícito GitHub agrega pipefail: un fallo antes de "| cs2pr" rompe el paso.
    shell: bash

env:
  HUSKY: 0
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: pdo_pgsql, pdo_mysql, intl, redis

jobs:
  # ─────────────────────────────── Etapa 1: calidad ───────────────────────────────

  calidad-php:
    name: 1 · Calidad PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@v3
      - name: composer.json válido
        run: composer validate --strict
      - name: Dependencias PHP sin vulnerabilidades
        run: composer audit --no-interaction
      - name: Formato (Pint)
        run: ./vendor/bin/pint --test --format=checkstyle | cs2pr
      - name: Estándar PSR-12 (PHPCS)
        run: ./vendor/bin/phpcs -q --report=checkstyle | cs2pr
      - name: Diseño y complejidad (PHPMD)
        run: ./vendor/bin/phpmd analyze app config database routes --format github --ruleset phpmd.xml --no-progress
      - name: Análisis estático, nivel máximo (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  calidad-front:
    name: 1 · Calidad frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # El tema de Filament importa CSS desde vendor/: el build necesita las dependencias PHP.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --no-scripts
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dependencias npm sin vulnerabilidades
        run: npm audit --audit-level=moderate
      - name: ESLint
        run: npx eslint .
      - name: Formato (Prettier)
        run: npx prettier --check .
      - name: Build
        run: npm run build

  version:
    name: 1 · Versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Las etiquetas se leen al momento: si agregas "sin-version" y re-ejecutas el job, la toma.
      - name: ¿Etiqueta sin-version?
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
              --json labels --jq '.labels[].name' | grep -qx 'sin-version'; then
            echo "SIN_VERSION=1" >> "$GITHUB_ENV"
          fi
      - name: La versión sube cuando cambia código de producción
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          node scripts/ci/verificar-version.mjs "$BASE" HEAD

  commits:
    name: 1 · Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Mensajes de commit
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BASE" --to HEAD --verbose
          fi

  tamano-pr:
    name: 1 · Tamaño del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Las etiquetas se leen al momento: si agregas "pr-grande" y re-ejecutas el job, la toma.
      - name: ¿Etiqueta pr-grande?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
              --json labels --jq '.labels[].name' | grep -qx 'pr-grande'; then
            echo "PR_GRANDE=1" >> "$GITHUB_ENV"
          fi
      # Solo cuenta código de producción: aviso desde 400 líneas, falla desde 800.
      - name: Tamaño del código de producción
        run: node scripts/ci/verificar-tamano.mjs ${{ github.event.pull_request.base.sha }} HEAD

  # ─────────────────────────────── Etapa 2: pruebas ───────────────────────────────

  pruebas:
    name: 2 · Pruebas (${{ matrix.db }})
    needs: [calidad-php, calidad-front, version, commits, tamano-pr]
    # tamano-pr se salta en push: se permite "skipped", no "failure" ni "cancelled".
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: pgsql
            imagen: postgres:16
            puerto: 5432
            usuario: postgres
            clave: postgres
            cobertura: true
            opciones: >-
              --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
          - db: mysql
            imagen: mysql:8
            puerto: 3306
            usuario: root
            # Base de pruebas efímera: root sin contraseña, no se expone ningún secreto.
            clave: ''
            cobertura: false
            opciones: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
              --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 20s
    services:
      db:
        image: ${{ matrix.imagen }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          MYSQL_DATABASE: testing
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - ${{ matrix.puerto }}:${{ matrix.puerto }}
        options: ${{ matrix.opciones }}
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.puerto }}
      DB_DATABASE: testing
      DB_USERNAME: ${{ matrix.usuario }}
      DB_PASSWORD: ${{ matrix.clave }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: ${{ matrix.cobertura && 'pcov' || 'none' }}
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env && php artisan key:generate
      - name: Migraciones hacia arriba y hacia abajo
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Pest con cobertura mínima
        if: matrix.cobertura
        run: ./vendor/bin/pest --coverage --min=60
      - name: Pest
        if: ${{ !matrix.cobertura }}
        run: ./vendor/bin/pest

  # ───────────────────────────────── Etapa 3: E2E ─────────────────────────────────

  e2e:
    name: 3 · E2E (Playwright)
    needs: [pruebas]
    # Condición explícita: si no, el "skipped" de tamano-pr (en push) se propaga y salta esta etapa.
    if: ${{ !cancelled() && needs.pruebas.result == 'success' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Navegador
        run: npx playwright install --with-deps chromium
      # `artisan serve` no hereda las variables del job: todo va en .env.
      - name: Entorno
        run: |
          cp .env.example .env
          poner () { if grep -q "^$1=" .env; then sed -i "s#^$1=.*#$1=$2#" .env; else echo "$1=$2" >> .env; fi; }
          # local: el panel deja entrar sin roles hasta E2-01.
          poner APP_ENV local
          poner APP_URL http://127.0.0.1:8000
          poner DB_DATABASE e2e
          poner CACHE_STORE file
          poner QUEUE_CONNECTION sync
          php artisan key:generate
          php artisan migrate:fresh --seed --force
      - name: Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
